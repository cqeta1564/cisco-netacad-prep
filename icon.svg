<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#151f32"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="97" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.4"/>
  
  <!-- 9 Cisco Bridge Bars centered -->
  <g fill="url(#barGrad)">
    <!-- b1 -->
    <rect x="76" y="290" width="24" height="70" rx="12"/>
    <!-- b2 -->
    <rect x="114" y="230" width="24" height="130" rx="12"/>
    <!-- b3 -->
    <rect x="152" y="180" width="24" height="180" rx="12"/>
    <!-- b4 -->
    <rect x="190" y="210" width="24" height="150" rx="12"/>
    <!-- b5 (center tower) -->
    <rect x="228" y="140" width="24" height="220" rx="12"/>
    <!-- b6 -->
    <rect x="266" y="210" width="24" height="150" rx="12"/>
    <!-- b7 -->
    <rect x="304" y="180" width="24" height="180" rx="12"/>
    <!-- b8 -->
    <rect x="342" y="230" width="24" height="130" rx="12"/>
    <!-- b9 -->
    <rect x="380" y="290" width="24" height="70" rx="12"/>
  </g>
  
  <!-- Subtitle Text -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="2">CISCO PREP</text>
</svg>
